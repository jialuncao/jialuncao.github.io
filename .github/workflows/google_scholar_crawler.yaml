name: Get Citation Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A slow scheduled run should never block a later one for 6 hours.
concurrency:
  group: citation-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r google_scholar_crawler/requirements.txt
    - name: Crawl Google Scholar
      timeout-minutes: 10
      run: |
        cd google_scholar_crawler
        python main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Check for results
      id: results
      run: |
        if [ -f google_scholar_crawler/results/gs_data.json ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No citation data produced; keeping the previously published data."
        fi
    - name: Push results
      if: steps.results.outputs.found == 'true'
      run: |
        cd google_scholar_crawler/results
        git init
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add *.json
        git commit -m "Updated Citation Data"
        git push --force "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
